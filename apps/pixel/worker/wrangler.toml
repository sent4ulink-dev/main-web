name = "pixel-share-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# The bucket that holds share content (create it once: npx wrangler r2 bucket create pixel-shares)
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "pixel-shares"

[vars]
# The deployed frontend's exact origin(s), comma separated, no trailing slash. sent4u.link is
# what the browser sees when reached through the gateway's ?share= proxy (the normal path);
# the .pages.dev origin covers visiting this app's own Pages URL directly.
CORS_ALLOWED_ORIGINS = "https://sent4u.link,https://pixel-dom-n49.pages.dev"
# The sent4u orders Worker (see /worker at the repo root), used to self-heal a share that isn't
# in this bucket yet by confirming with it that the id was really paid for and is really for
# Pixel. Leave empty to disable self-heal.
ORDERS_API_BASE = "https://sent4u-reviews.sent4u-link.workers.dev"

# Secret (never put this in this file — set it with `npx wrangler secret put SHARE_CREATE_SECRET`):
#   SHARE_CREATE_SECRET   gates POST /shares/:id/ensure. Nothing calls that endpoint today — every
#                         share is actually created lazily, the first time it's opened, by self-heal
#                         against the orders Worker above. /ensure exists for a future direct
#                         provisioning call; until then this secret just keeps it from being a way
#                         to mint arbitrary shares for free.
