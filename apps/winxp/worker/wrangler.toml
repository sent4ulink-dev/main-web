name = "winxp-share-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# The bucket that holds share content (create it once: npx wrangler r2 bucket create winxp-shares)
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "winxp-shares"

# Temporary story photos (auto-expiring, see PHOTO_TTL_MINUTES) and the per-IP upload
# throttle counter. Create it once: npx wrangler kv namespace create winxp-photos
# — then put the id it prints below.
[[kv_namespaces]]
binding = "PHOTOS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# The deployed frontend's exact origin(s), comma separated, no trailing slash. Empty
# allows any origin, which is fine for local dev but should be set for production.
CORS_ALLOWED_ORIGINS = ""
# The sent4u orders Worker (see /worker at the repo root), used to self-heal a share
# that isn't in this bucket yet by confirming with it that the id was really paid for
# and is really for WinXP. Leave empty to disable self-heal.
ORDERS_API_BASE = ""
# How long an uploaded story photo stays downloadable before it expires. Clamped to 1-60.
PHOTO_TTL_MINUTES = "15"

# Secret (never put this in this file — set it with `npx wrangler secret put SHARE_CREATE_SECRET`):
#   SHARE_CREATE_SECRET   gates POST /shares/:id/ensure. Nothing calls that endpoint today —
#                         every share is actually created lazily, the first time it's
#                         opened, by self-heal against the orders Worker above. /ensure
#                         exists for a future direct provisioning call; until then this
#                         secret just keeps it from being a way to mint shares for free.
