services:
  - type: web
    name: urilga-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: CORS_ORIGIN
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      # Optional — password-gates the bare studio (via /api/studio/unlock). Unset
      # disables the lock entirely.
      - key: STUDIO_PASSWORD
        sync: false
      # R2_* (all four): optional — shares are stored in Cloudflare R2 (one object
      # per share, individually browsable) when set, or fall back to the disk below
      # when unset. See DEPLOY.md "Storing shares in Cloudflare R2".
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
    # Only actually used as a fallback once R2_* above is set — see DEPLOY.md.
    disk:
      name: urilga-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
