# Cloudflare Pages: the Vite build in dist/ plus this card's API (functions/api, same address).
# Deploy with `npm run deploy` (scripts/deploy-card.mjs): Pages looks upwards for its config and would find the repo root's wrangler.jsonc,
# and refuses --config, so the card is staged in an empty folder first.
name = "sent4u-thanksgiving"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-01"

# the saved cards: host links (with their guest lists and family photos), guest links and the studio draft (see server/api.js)
# create it once: npx wrangler r2 bucket create sent4u-thanksgiving-shares
[[r2_buckets]]
binding = "SHARES"
bucket_name = "sent4u-thanksgiving-shares"

[vars]
# the sent4u orders server: every ?share=<id> is checked against it (GET /links/<id>) before a card is made
ORDERS_API_BASE = "https://sent4u-reviews.sent4u-link.workers.dev"
# the address generated links (host and guest) start with, and the sites allowed to save changes: sent4u.link is what
# the browser sees (the gateway proxies this card), the pages.dev address covers visiting the card directly
PUBLIC_ORIGIN = "https://sent4u.link"
CORS_ORIGIN = "https://sent4u.link,https://sent4u-thanksgiving.pages.dev"

# Secrets (never in this file): npx wrangler pages secret put NAME --project-name sent4u-thanksgiving
#   STUDIO_PASSWORD      opens the private studio at the card's own address (required; every studio call fails closed without it)
#   SHARE_CREATE_SECRET  optional: lets a server call POST /api/invitations/<id>/ensure; without it the orders server is asked
