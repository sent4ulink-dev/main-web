<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#3a2418" />
    <title>Thanksgiving Together</title>
    <meta name="description" content="A 3D Thanksgiving invitation for the whole family: pick your seat, dress up your character, RSVP, share what you're thankful for, pull the wishbone and pose for the family photo." />
    <link rel="icon" href="/brand/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/brand/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
  </head>
  <body>
    <!-- inline editing toolbar: its own strip at the top (the scene moves down; nothing is covered) -->
    <div id="editor-toolbar" class="editor-toolbar" aria-label="Editing tools" hidden></div>
    <canvas id="scene" aria-label="A farmhouse set for Thanksgiving dinner"></canvas>

    <div id="ui">
      <img id="scene-logo" src="/brand/wordmark.webp" alt="sent4u" width="582" height="128" decoding="async">
      <!-- loading -->
      <section id="loader" class="screen" aria-live="polite">
        <div class="loader-inner">
          <div class="loader-ring"><svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52" /><circle class="bar" cx="60" cy="60" r="52" /></svg><span class="loader-pct">0%</span></div>
          <p class="loader-text">Warming up the oven…</p>
        </div>
      </section>

      <!-- intro, out on the porch -->
      <section id="intro" class="screen" hidden>
        <div class="intro-float float-type" id="intro-float">
          <p class="eyebrow" data-intro="eyebrow"></p>
          <h1 class="display"><span data-intro="title"></span> <span class="family" data-intro="family" data-k="family"></span></h1>
          <p class="hand rotating"><span class="hand-prefix">and</span> <span class="hand-word" aria-live="off" aria-hidden="true"></span></p>
          <p class="intro-who" data-intro="who" hidden></p>
          <button class="btn-float primary big" id="open-gift"><span class="spark" aria-hidden="true">🍂</span> Come on in</button>
          <p class="hint">Best with the sound on 🔊</p>
        </div>
      </section>

      <!-- chapter text: floats beside the 3D thing it belongs to -->
      <section id="chapter" hidden>
        <article class="float-type" id="chapter-card">
          <p class="eyebrow" id="ch-eyebrow"></p>
          <h2 class="display" id="ch-title"></h2>
          <div class="card-body" id="ch-body"></div>
          <div class="card-actions" id="ch-actions"></div>
        </article>
      </section>

      <!-- the dress-up dock: categories and choices, along the bottom -->
      <section id="dock" hidden aria-label="Dress up your character"></section>

      <!-- a speech bubble over someone at the table -->
      <div id="bubble" class="bubble" hidden aria-live="polite"></div>

      <!-- the family photo: the camera's frame and its button -->
      <section id="viewfinder" hidden aria-label="Camera">
        <div class="vf-frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div class="vf-count" aria-live="assertive"></div>
        <div class="vf-controls">
          <p class="vf-hint float-type">Everybody squeeze in… say “pie!”</p>
          <div class="vf-shutter-wrap">
            <span class="vf-pointer" aria-hidden="true">👆</span>
            <button class="vf-shutter" id="vf-shutter" aria-label="Take the photo"><span></span></button>
          </div>
        </div>
      </section>

      <!-- finale -->
      <section id="finale" class="screen" hidden>
        <div class="finale-card float-type">
          <h2 class="display finale-title"></h2>
          <p class="hand finale-sub"></p>
          <div class="float-actions">
            <button class="btn-float primary" id="capture-moment"><span class="spark" aria-hidden="true">📷</span> Take the family photo</button>
            <button class="btn-float" id="watch-again">↻ Start over</button>
          </div>
        </div>
      </section>

      <!-- navigation -->
      <nav id="nav" hidden aria-label="Chapters">
        <button class="nav-btn" id="nav-prev" aria-label="Previous">‹</button>
        <div class="nav-mid">
          <span class="nav-title" id="nav-title"></span>
          <span class="nav-dots" id="nav-dots"></span>
        </div>
        <span class="nav-count" id="nav-count"></span>
        <button class="nav-btn primary" id="nav-next" aria-label="Next">›</button>
      </nav>

      <!-- top bar -->
      <div id="topbar" hidden>
        <button class="icon-btn" id="hide-ui" hidden aria-label="Hide the words" title="Hide the words">🙈</button>
        <button class="icon-btn" id="btn-sound" aria-label="Mute" aria-pressed="false">🔊</button>
        <button class="icon-btn" id="btn-full" aria-label="Full screen">⛶</button>
        <button class="icon-btn" id="btn-credits" aria-label="Credits">ⓘ</button>
      </div>

      <!-- credits -->
      <section id="credits-sheet" class="sheet" hidden>
        <div class="credits" role="dialog" aria-modal="true" aria-label="Credits">
          <button class="icon-btn close" data-close aria-label="Close">✕</button>
          <h2 class="display">Credits</h2>
          <div class="credits-list"></div>
        </div>
      </section>

      <!-- the host's guest list -->
      <section id="guests-sheet" class="sheet" hidden>
        <div class="guests-panel" role="dialog" aria-modal="true" aria-label="Guest list"></div>
      </section>

      <div id="toast" role="status" aria-live="polite"></div>

      <!-- owner controls: mode, edit the wording, the guest list, the guest link, make a link (studio), reset (test) -->
      <div id="owner-bar" class="owner-bar" hidden><span id="mode-label" class="mode-label"></span><button id="edit-toggle" class="owner-btn" type="button" hidden>✎ Edit wording</button><button id="guests-toggle" class="owner-btn" type="button" hidden>👥 Guest list</button><button id="guest-link" class="owner-btn primary" type="button" hidden>🔗 Guest link</button><button id="generate-link" class="owner-btn primary" type="button" hidden>🔗 Make link</button><button id="view-as" class="owner-btn" type="button" hidden></button><button id="reset-demo" class="owner-btn" type="button" hidden>↺ Reset</button></div>
      <div id="letter-edit" class="letter-edit" hidden></div>
      <!-- studio password, loading and "link unavailable" states -->
      <section id="mode-gate" class="screen mode-gate" hidden></section>
      <button class="ui-show" id="ui-show" hidden aria-label="Show the words"><span aria-hidden="true">👁</span> Show</button>
    </div>

    <dialog id="share-link-dialog" class="share-link-dialog" aria-labelledby="share-link-title">
      <h2 id="share-link-title" class="display">Your link</h2>
      <p class="link-note">Whoever has this link can edit the card’s wording for 5 days (unless you finish it permanently), and run the guest list until the big day.</p>
      <output id="share-url"></output>
      <div class="tb-row"><button type="button" class="btn-float primary" data-copy-link>Copy</button><button type="button" class="btn-float" data-share-link hidden>Share…</button><button type="button" class="btn-float" data-close-link>Close</button></div>
      <p class="link-status" role="status"></p>
    </dialog>
    <noscript>This card needs JavaScript and WebGL.</noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
