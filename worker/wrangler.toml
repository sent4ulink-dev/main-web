name = "sent4u-reviews"
main = "src/index.js"
compatibility_date = "2025-01-01"

# the bucket that holds the reviews (create it once: npx wrangler r2 bucket create sent4u-reviews)
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "sent4u-reviews"

# Sign-in: one-time login tokens and sessions, both short-lived — KV's native TTL expires them
# automatically. Create it once: npx wrangler kv namespace create sent4u-auth — then put the id
# it prints below.
[[kv_namespaces]]
binding = "AUTH"
id = "312c951c20e243a4af1c426e75502bde"

[vars]
# the sites that may send reviews, comma separated. Put your real address here, e.g. https://sent4u.link
ALLOWED_ORIGINS = "https://sent4u.link,http://localhost:4173"

# Selling links (see "Orders" in the README). The two one-time Prices created in your Paddle dashboard, one per pack.
# PADDLE_PRICE_SINGLE = "pri_..."          # the $1.99 · 1 link price
# PADDLE_PRICE_PACK   = "pri_..."          # the $9.99 · 8 links price
# PADDLE_API_BASE = "https://sandbox-api.paddle.com"   # only set this while testing against a Paddle sandbox account; omit it in production
# LINK_ORIGIN = "https://sent4u.link"      # what the links start with (this is the default)

# Sign-in emails (see "Sign-in" in the README). EMAIL_FROM must be an address at a domain you've
# verified with Resend, e.g. "sent4u <hello@sent4u.link>" — Resend's own onboarding@resend.dev
# works unverified but only for testing.
# EMAIL_FROM = "sent4u <hello@sent4u.link>"

# Secrets (never put these in this file — set them with `npx wrangler secret put NAME`):
#   ADMIN_TOKEN            lets you delete a review
#   TURNSTILE_SECRET       optional: turns on the Cloudflare human check (see README)
#   PADDLE_API_KEY         lets this Worker create a Paddle checkout (Paddle dashboard → Developer Tools → Authentication)
#   PADDLE_WEBHOOK_SECRET  verifies that a "payment arrived" notice really came from Paddle (Paddle dashboard → Notifications → your webhook destination)
#   ORDER_SECRET           lets you confirm or refund an order by hand, e.g. to fix one Paddle's webhook missed
#   IP_SALT                optional: any random text, makes the stored IP hashes harder to reverse
#   RESEND_API_KEY         sends the sign-in email (resend.com → API Keys)
