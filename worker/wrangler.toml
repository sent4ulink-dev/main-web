name = "sent4u-reviews"
main = "src/index.js"
compatibility_date = "2025-01-01"

# the bucket that holds the reviews (create it once: npx wrangler r2 bucket create sent4u-reviews)
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "sent4u-reviews"

[vars]
# the sites that may send reviews, comma separated. Put your real address here, e.g. https://sent4u.link
ALLOWED_ORIGINS = "https://sent4u.link,http://localhost:4173"

# Selling links (see "Orders" in the README). Payment links from your payment provider, one per pack; "{token}" is replaced by the order's token.
# CHECKOUT_URL_SINGLE = "https://.../single?client_reference_id={token}"
# CHECKOUT_URL_PACK   = "https://.../pack?client_reference_id={token}"
# LINK_ORIGIN = "https://sent4u.link"      # what the links start with (this is the default)

# Secrets (never put these in this file — set them with `npx wrangler secret put NAME`):
#   ADMIN_TOKEN       lets you delete a review
#   TURNSTILE_SECRET  optional: turns on the Cloudflare human check (see README)
#   ORDER_SECRET      lets your payment webhook (or you) confirm and refund orders
#   IP_SALT           optional: any random text, makes the stored IP hashes harder to reverse
