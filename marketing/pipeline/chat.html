<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#f4f0ff;color:#1b1030;font:16px -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.sb{height:50px;background:#fff;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 8px 34px;font-weight:600;font-size:16px}
.ic{display:flex;gap:6px;align-items:center}.bars{display:flex;gap:2px;align-items:flex-end}.bars i{width:3px;background:#1b1030;border-radius:1px;display:block}
.bat{width:24px;height:12px;border:1.5px solid #1b1030;border-radius:3px;padding:1.5px;position:relative}.bat b{display:block;height:100%;width:78%;background:#1b1030;border-radius:1px}
.bat:after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:#1b1030;border-radius:0 1px 1px 0}
.top{padding:10px 16px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #e3dcf5;background:#fff}
.back{color:#7c3aed;font-size:28px;line-height:1}.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#ff7a1a,#7c3aed);display:grid;place-items:center;font-weight:700;font-size:20px;color:#fff}
.nm{font-weight:700;font-size:19px}.st{font-size:13px;color:#7a6f92}
.msgs{flex:1;padding:16px 12px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px}
.b{max-width:80%;padding:12px 16px;border-radius:22px;font-size:20px;line-height:1.3;animation:pop .28s ease-out both}
.in{background:#fff;color:#1b1030;box-shadow:0 1px 2px #0001;align-self:flex-start;border-bottom-left-radius:6px}.out{background:#7c3aed;color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.link{align-self:flex-end;width:300px;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 2px 6px #0002;animation:pop .32s ease-out both;border-bottom-right-radius:6px}
.link img{display:block;width:300px;height:200px;object-fit:cover}.link .t{padding:10px 14px 2px;font-weight:700;font-size:18px}.link .u{padding:0 14px 12px;font-size:15px;color:#7a6f92}
.del{align-self:flex-end;font-size:14px;color:#7a6f92;margin-right:4px;animation:pop .3s ease-out both}
.bar{display:flex;gap:8px;align-items:center;padding:10px 12px 10px;background:#fff;border-top:1px solid #e3dcf5}
.inp{flex:1;min-height:44px;border:1px solid #d9d0ef;border-radius:22px;padding:11px 14px;color:#1b1030;font-size:15px;background:#faf8ff;white-space:nowrap;overflow:hidden}
.send{width:80px;height:44px;border-radius:22px;background:#7c3aed;color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px;transition:transform .12s,background .12s}
.send.tap{transform:scale(.86);background:#9f67ff}
.mic{width:40px;height:40px;border-radius:50%;background:#ede7fb;display:grid;place-items:center;font-size:18px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.caret{display:inline-block;width:2px;height:18px;background:#7c3aed;vertical-align:-3px;animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
</style></head><body>
<div class="sb"><span>9:41</span><span class="ic"><span class="bars"><i style="height:5px"></i><i style="height:7px"></i><i style="height:9px"></i><i style="height:11px"></i></span><svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 11.5 6 8.6a3.6 3.6 0 0 1 5 0Z M3.6 6.3a7 7 0 0 1 9.8 0l-1.4 1.5a5 5 0 0 0-7 0Z M1.2 3.9a10.4 10.4 0 0 1 14.6 0l-1.4 1.5a8.4 8.4 0 0 0-11.8 0Z" fill="#1b1030"/></svg><span class="bat"><b></b></span></span></div>
<div class="top"><span class="back">‹</span><div class="av">S</div><div><div class="nm">Sam</div><div class="st">online</div></div></div>
<div class="msgs" id="m"><div class="b in" style="animation:none">any plans for the 31st? 👀</div><div class="b out" style="animation:none">maybe… check this 🕸️</div></div>
<div class="bar"><div class="inp" id="i">sent4u.link/?share=test-spooky<span class="caret"></span></div><div class="send" id="s">Send</div><div class="mic">🎙</div></div>
<script>
const m=document.getElementById('m'),i=document.getElementById('i'),s=document.getElementById('s');const wait=t=>new Promise(r=>setTimeout(r,t));
window.sendLink=async()=>{s.classList.add('tap');await wait(130);s.classList.remove('tap');i.innerHTML='<span class="caret"></span>';
const d=document.createElement('div');d.className='link';d.innerHTML='<img src="preview.jpg"><div class="t">Halloween Night 🎃</div><div class="u">sent4u.link</div>';m.appendChild(d);
await wait(700);const e=document.createElement('div');e.className='del';e.textContent='Delivered';m.appendChild(e);};
</script></body></html>
